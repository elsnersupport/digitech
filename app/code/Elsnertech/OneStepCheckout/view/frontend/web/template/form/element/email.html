<div class="step-item">
    <div class="step-item-label">
        <div class="step-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" width="2rem" height="2rem"
                class="Step_StepTitleIcon__cr4hM SvgIcon_SvgIcon__XZVZw">
                <path fill="currentColor" fill-rule="evenodd"
                    d="M9.964 9.631a7.222 7.222 0 0 1 .072 0 2.58 2.58 0 1 0-.072 0Zm-2.61.492a4.053 4.053 0 1 1 5.29 0l.02.007a7.04 7.04 0 0 1 2.27 1.428 6.623 6.623 0 0 1 1.527 2.152c.356.808.54 1.676.54 2.553a.737.737 0 0 1-1.475 0c0-.671-.14-1.337-.414-1.96a5.148 5.148 0 0 0-1.188-1.672 5.565 5.565 0 0 0-1.795-1.128 5.868 5.868 0 0 0-2.088-.398H9.96a5.866 5.866 0 0 0-2.09.398 5.566 5.566 0 0 0-1.794 1.128 5.149 5.149 0 0 0-1.188 1.673 4.859 4.859 0 0 0-.414 1.959.737.737 0 0 1-1.474 0c0-.877.184-1.745.54-2.553a6.621 6.621 0 0 1 1.526-2.152 7.04 7.04 0 0 1 2.289-1.435Z"
                    clip-rule="evenodd"></path>
            </svg>
        </div>
        <div class="step-label">
            <span data-bind="i18n: 'Email'"></span>
        </div>
    </div>
    <div class="step-item-content">
        <div class="step-item-action-label" data-trigger="trigger-email" class="action">
            <div class="account-icon-mobile" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" width="1.6rem" height="1.6rem"
                    class="EmailStep_EmailStepIcon__c-A4v SvgIcon_SvgIcon__XZVZw">
                    <path fill="currentColor" fill-rule="evenodd"
                        d="M9.964 9.631a7.222 7.222 0 0 1 .072 0 2.58 2.58 0 1 0-.072 0Zm-2.61.492a4.053 4.053 0 1 1 5.29 0l.02.007a7.04 7.04 0 0 1 2.27 1.428 6.623 6.623 0 0 1 1.527 2.152c.356.808.54 1.676.54 2.553a.737.737 0 0 1-1.475 0c0-.671-.14-1.337-.414-1.96a5.148 5.148 0 0 0-1.188-1.672 5.565 5.565 0 0 0-1.795-1.128 5.868 5.868 0 0 0-2.088-.398H9.96a5.866 5.866 0 0 0-2.09.398 5.566 5.566 0 0 0-1.794 1.128 5.149 5.149 0 0 0-1.188 1.673 4.859 4.859 0 0 0-.414 1.959.737.737 0 0 1-1.474 0c0-.877.184-1.745.54-2.553a6.621 6.621 0 0 1 1.526-2.152 7.04 7.04 0 0 1 2.289-1.435Z"
                        clip-rule="evenodd"></path>
                </svg>
            </div>
            <div data-bind="i18n: stepLabel()" class="output-content" id="emailStepLabel">Add email to continue</div>
            <div class="step-item-action-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" width="2rem" height="2rem"
                    class="SvgIcon_SvgIcon__XZVZw initial-icon">
                    <path fill="currentColor" fill-rule="evenodd"
                        d="M6.793 3.043a1 1 0 0 1 1.414 0l6.25 6.25a1 1 0 0 1 0 1.414l-6.25 6.25a1 1 0 0 1-1.414-1.414L12.336 10 6.793 4.457a1 1 0 0 1 0-1.414Z"
                        clip-rule="evenodd"></path>
                </svg>
                <div class="change-data" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" width="2.4rem"
                        height="2.4rem" class="SvgIcon_SvgIcon__XZVZw">
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M14.376 4.211a1.404 1.404 0 0 1 1.985 0L19.79 7.64m0 0a1.404 1.404 0 0 1 0 1.985l-9.426 9.426a1 1 0 0 1-.534.278l-4.855.857a1 1 0 0 1-1.159-1.159l.857-4.855a1 1 0 0 1 .278-.534l9.426-9.426m.992 1.836-8.781 8.782-.554 3.138 3.138-.554 8.782-8.781-2.585-2.585Z"
                            clip-rule="evenodd"></path>
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M11.665 6.92a1 1 0 0 1 1.414 0l3.999 3.999a1 1 0 0 1-1.414 1.414l-3.999-3.999a1 1 0 0 1 0-1.414Z"
                            clip-rule="evenodd"></path>
                    </svg>
                </div>
            </div>
        </div>
        <div class="mobile-cart-items">
        </div>
        <div data-bind="mageInit: {
                'Magento_Ui/js/modal/modal':{
                    'type': 'popup',
                    'title': jQuery.mage.__('Please add email to track your order'),
                    'responsive': true,
                    'buttons':[],
                    'modalClass':'checkout-modal'
                }}" style="display: none;" id="email-step-popup" class="checkout-modal">
            <div class="content step-item-modal-content">
                <!-- ko ifnot: isCustomerLoggedIn() -->

                <!-- ko foreach: getRegion('before-login-form') -->
                <!-- ko template: getTemplate() --><!-- /ko -->
                <!-- /ko -->
                <form class="form form-login" data-role="email-with-possible-login" data-bind="submit:login"
                    method="post">
                    <fieldset id="customer-email-fieldset" class="fieldset" data-bind="blockLoader: isLoading">
                        <div class="field required">
                            <label class="label" for="customer-email"><span
                                    data-bind="i18n: 'Email Address'"></span></label>
                            <div class="control _with-tooltip">
                                <input class="input-text" type="email" data-bind="
                            textInput: email,
                            hasFocus: emailFocused,
                            afterRender: emailHasChanged,
                            mageInit: {'mage/trim-input':{}}" name="username"
                                    data-validate="{required:true, 'validate-email':true}" id="customer-email" />
                                <!-- ko template: 'ui/form/element/helper/tooltip' --><!-- /ko -->
                                <span class="note"
                                    data-bind="fadeVisible: isPasswordVisible() == false"><!-- ko i18n: 'You can create an account after checkout.'--><!-- /ko --></span>
                            </div>
                        </div>

                        <!--Hidden fields -->
                        <fieldset class="fieldset hidden-fields" data-bind="fadeVisible: isPasswordVisible()">
                            <div class="field">
                                <label class="label" for="customer-password"><span
                                        data-bind="i18n: 'Password'"></span></label>
                                <div class="control">
                                    <div class="password-field">
                                        <input class="input-text" data-bind="
                                        attr: {
                                            placeholder: $t('Password'),
                                        }" type="password" name="password" id="customer-password"
                                            data-validate="{required:true}" autocomplete="off" />
                                        <div class="show-password" data-bind="click:togglePassword"
                                            style="cursor: pointer;">
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                width="2.4rem" height="2.4rem"
                                                class="TextField_TextFieldEye__K0MfI SvgIcon_SvgIcon__XZVZw show-password-svg">
                                                <path stroke="currentColor" stroke-linecap="round"
                                                    stroke-linejoin="round" stroke-width="2"
                                                    d="M21.256 10.962c.474.62.474 1.457 0 2.076C19.764 14.987 16.181 19 12 19c-4.181 0-7.763-4.013-9.256-5.962a1.692 1.692 0 0 1 0-2.076C4.236 9.013 7.818 5 11.999 5c4.182 0 7.764 4.013 9.257 5.962v0Z">
                                                </path>
                                                <path stroke="currentColor" stroke-linecap="round"
                                                    stroke-linejoin="round" stroke-width="2"
                                                    d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path>
                                            </svg>
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                width="2.4rem" height="2.4rem"
                                                class="TextField_TextFieldEye__K0MfI SvgIcon_SvgIcon__XZVZw hide-password-svg"
                                                style="display:none;">
                                                <path stroke="currentColor" stroke-linecap="round"
                                                    stroke-linejoin="round" stroke-width="2"
                                                    d="M6.873 17.129c-1.845-1.31-3.305-3.014-4.13-4.09a1.693 1.693 0 0 1 0-2.077C4.236 9.013 7.818 5 12 5c1.876 0 3.63.807 5.13 1.874">
                                                </path>
                                                <path stroke="currentColor" stroke-linecap="round"
                                                    stroke-linejoin="round" stroke-width="2"
                                                    d="M14.13 9.887a3 3 0 1 0-4.243 4.242M4 20 20 4M10 18.704c.65.193 1.323.293 2 .296 4.182 0 7.764-4.013 9.257-5.962a1.694 1.694 0 0 0-.001-2.078A22.94 22.94 0 0 0 19.57 9">
                                                </path>
                                            </svg>
                                        </div>
                                    </div>

                                    <span class="note"
                                        data-bind="i18n: 'You already have an account with us. Please sign in!'"></span>
                                </div>

                            </div>
                            <!-- ko foreach: getRegion('additional-login-form-fields') -->
                            <!-- ko template: getTemplate() --><!-- /ko -->
                            <!-- /ko -->
                            <div class="forgot-password">
                                <div class="secondary">
                                    <a class="action remind" data-bind="attr: { href: forgotPasswordUrl }">
                                        <span data-bind="i18n: 'Forgot Your Password?'"></span>
                                    </a>
                                </div>
                            </div>
                            <div class="actions-toolbar">
                                <input name="context" type="hidden" value="checkout" />
                                <div class="primary">
                                    <button type="submit" class="action login primary"
                                        data-action="checkout-method-login"><span
                                            data-bind="i18n: 'Login'"></span></button>
                                </div>
                            </div>
                        </fieldset>
                        <!--Hidden fields -->
                    </fieldset>
                </form>
                <div class="modal-action-buttons" data-bind="fadeVisible: isPasswordVisible">
                    <button type="button" class="action-secondary" data-role="closeBtn-continueAsGuestInspiteOfCustomer"
                        data-bind="i18n:'Continue as Guest', click:continueAsGuest"></button>
                </div>
                <div class="modal-action-buttons" data-bind="fadeVisible: !isPasswordVisible()">
                    <button type="button" class="action-secondary" data-role="closeBtn-continueAsGuest"
                        data-bind="i18n:'Continue', click:continueAsGuest"></button>
                </div>
                <!-- /ko -->
            </div>
        </div>
    </div>
</div>
