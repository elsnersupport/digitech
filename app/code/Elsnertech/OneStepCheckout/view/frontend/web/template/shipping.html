<each if="!quoteIsVirtual" args="getRegion('customer-email')" render=""></each>

    <div class="step-item-label">
        <div class="step-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" width="2rem" height="2rem"
                class="Step_StepTitleIcon__cr4hM SvgIcon_SvgIcon__XZVZw">
                <path fill="currentColor"
                    d="M4.167 18.333h11.666a1.667 1.667 0 0 0 1.667-1.666v-7.5a.834.834 0 0 0-.242-.592l-6.666-6.667a.834.834 0 0 0-1.175 0L2.75 8.575a.833.833 0 0 0-.25.592v7.5a1.667 1.667 0 0 0 1.667 1.666Zm4.166-1.666V12.5h3.334v4.167H8.333ZM4.167 9.508 10 3.675l5.833 5.833v7.159h-2.5V12.5a1.667 1.667 0 0 0-1.666-1.667H8.333A1.667 1.667 0 0 0 6.667 12.5v4.167h-2.5V9.508Z">

        </div>
        <div class="step-label">
            <span data-bind="i18n: 'Shipping Address'"></span>
        </div>
    </div>
    <div class="step-item-content">
        <div class="step-item-action-label" data-trigger="trigger-shipping-address" class="action">
            <div class="mobile-label-after-change" style="display: none;">
                Shipping Address
            </div>
            <div id="shippingAddressStepLabel" class="output-content">Add Shipping Address</div>
            <div class="step-item-action-icon">

                    class="SvgIcon_SvgIcon__XZVZw initial-icon">

                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" width="2.4rem"
                        height="2.4rem" class="SvgIcon_SvgIcon__XZVZw">
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M14.376 4.211a1.404 1.404 0 0 1 1.985 0L19.79 7.64m0 0a1.404 1.404 0 0 1 0 1.985l-9.426 9.426a1 1 0 0 1-.534.278l-4.855.857a1 1 0 0 1-1.159-1.159l.857-4.855a1 1 0 0 1 .278-.534l9.426-9.426m.992 1.836-8.781 8.782-.554 3.138 3.138-.554 8.782-8.781-2.585-2.585Z"
                            clip-rule="evenodd"></path>
                        <path fill="currentColor" fill-rule="evenodd"

                            clip-rule="evenodd"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div data-bind="mageInit: {
                'Magento_Ui/js/modal/modal':{
                    'type': 'popup',
                    'title': jQuery.mage.__('Add Shipping Address'),
                    'responsive': true,
                    'buttons':[],
                    'modalClass':'checkout-modal'
                }}" style="display: none;" id="shipping-address-popup">
            <div class="content">
                <div id="shipping" class="checkout-shipping-address" data-bind="fadeVisible: true">
                    <div class="step-title" translate="'Shipping Address'" data-role="title" style="display: none;">
                    </div>
                    <div id="checkout-step-shipping" class="step-content" data-role="content">
                        <each args="getRegion('address-list')" render=""></each>
                        <each args="getRegion('address-list-additional-addresses')" render=""></each>

                        <!-- Address form pop up -->
                        <if args="!isFormInline">
                            <div class="new-address-popup">
                                <button type="button" class="action action-show-popup" click="showFormPopUp"
                                    visible="!isNewAddressAdded()">
                                    <span translate="'New Address'"></span>
                                </button>
                            </div>
                            <div id="opc-new-shipping-address" visible="isFormPopUpVisible()"
                                render="shippingFormTemplate"></div>
                        </if>

                        <each args="getRegion('before-form')" render=""></each>

                        <!-- Inline address form -->
                        <render if="isFormInline" args="shippingFormTemplate"></render>
                    </div>
                </div>
                <div class="modal-action-buttons">
                    <button type="button" class="action-secondary" data-bind="click: shippingAddressFormClose">
                        Save & close
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="billing-address-same-as-shipping-block field choice">
    <input type="checkbox" name="billing-address-same-as-shipping"
        data-bind="checked: isAddressSameAsShipping, click: useShippingAddress, attr: {id: 'billing-address-same-as-shipping-shared'}"
        style="opacity: 0;" />
    <label data-bind="attr: {for: 'billing-address-same-as-shipping-shared'}">
        <span data-bind="i18n: 'Is the billing address different?'"></span>
        <span data-bind="click:()=>{document.querySelector('#billing-address-same-as-shipping-shared').click()}">
            <b style="cursor: pointer;" data-bind="visible:isAddressSameAsShipping">Add billing address</b>
            <b style="cursor: pointer;" data-bind="visible:isShowBillingForm">Use same as shipping</b>
        </span>
    </label>
</div>

    <div class="step-item-content">
        <div class="step-item-action-label" data-trigger="trigger-billing-address" class="action">
            <div class="mobile-label-after-change" style="display: none;">
                Billing Address
            </div>
            <div id="billingAddressStepLabel" class="output-content">Add Billing Address</div>
            <div class="step-item-action-icon">

                    <path fill="currentColor" fill-rule="evenodd"

                        <path fill="currentColor" fill-rule="evenodd"

                            clip-rule="evenodd"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>
    <div data-bind="mageInit: {
        'Magento_Ui/js/modal/modal':{
            'type': 'popup',
            'title': jQuery.mage.__('Add Billing Address'),
            'responsive': true,
            'buttons':[],
            'modalClass':'checkout-modal'
        }}" style="display: none;" id="billing-address-popup">
        <div class="content">
            <div id="billing" class="checkout-billing-address" data-bind="fadeVisible: true">
                <div class="step-title" translate="'Billing Address'" data-role="title" style="display: none;">
                </div>
                <div id="checkout-step-billing" class="step-content" data-role="content">
                    <div id="billing-address-container">
                        <div class="form-billing-address">
                            <each args="getRegion('billing-address')" render=""></each>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-action-buttons">
                <button type="button" class="action-secondary" data-bind="click:billingAddressFormClose">

<div class="step-item">
    <div class="step-item-label">
        <div class="step-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" width="2rem" height="2rem"
                class="Step_StepTitleIcon__cr4hM SvgIcon_SvgIcon__XZVZw">
                <path stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"
                    d="M5.091 16.954a1.636 1.636 0 1 0 0-3.272 1.636 1.636 0 0 0 0 3.272ZM14.5 16.954a1.636 1.636 0 1 0 0-3.272 1.636 1.636 0 0 0 0 3.272Z">
                </path>
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M3.455 15.318H1V4h11.864v11.318H6.727"></path>
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M12.863 15.319v-7.82h3.507L19 11.842v3.478h-2.532"></path>
            </svg>
        </div>
        <div class="step-label">
            <span data-bind="i18n: 'Shipping Method'" class="output-content"></span>
        </div>
    </div>
    <div class="step-item-content">
        <div class="step-item-action-label" data-trigger="trigger-shipping-method" class="action">
            <div class="mobile-label-after-change" style="display: none;">
                Shipping Method
            </div>
            <div data-bind="i18n: 'Select Shipping Method'" id="shippingMethodSelectStepLabel" class="output-content">
            </div>
            <div class="step-item-action-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" width="2rem" height="2rem"
                    class="SvgIcon_SvgIcon__XZVZw initial-icon">
                    <path fill="currentColor" fill-rule="evenodd"
                        d="M6.793 3.043a1 1 0 0 1 1.414 0l6.25 6.25a1 1 0 0 1 0 1.414l-6.25 6.25a1 1 0 0 1-1.414-1.414L12.336 10 6.793 4.457a1 1 0 0 1 0-1.414Z"
                        clip-rule="evenodd"></path>
                </svg>
                <div class="change-data" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" width="2.4rem"
                        height="2.4rem" class="SvgIcon_SvgIcon__XZVZw">
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M14.376 4.211a1.404 1.404 0 0 1 1.985 0L19.79 7.64m0 0a1.404 1.404 0 0 1 0 1.985l-9.426 9.426a1 1 0 0 1-.534.278l-4.855.857a1 1 0 0 1-1.159-1.159l.857-4.855a1 1 0 0 1 .278-.534l9.426-9.426m.992 1.836-8.781 8.782-.554 3.138 3.138-.554 8.782-8.781-2.585-2.585Z"
                            clip-rule="evenodd"></path>
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M11.665 6.92a1 1 0 0 1 1.414 0l3.999 3.999a1 1 0 0 1-1.414 1.414l-3.999-3.999a1 1 0 0 1 0-1.414Z"
                            clip-rule="evenodd"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div data-bind="mageInit: {
                'Magento_Ui/js/modal/modal':{
                    'type': 'popup',
                    'title': jQuery.mage.__('Select Shipping Method'),
                    'responsive': true,
                    'buttons':[],
                    'modalClass':'checkout-modal shipping-method-popup'
                }}" style="display: none;" id="shipping-method-popup">
            <div class="content">
                <!--Shipping method template-->
                <div id="opc-shipping_method" class="checkout-shipping-method"
                    data-bind="fadeVisible: true, blockLoader: isLoading" role="presentation">
                    <div class="checkout-shipping-method">
                        <each args="getRegion('before-shipping-method-form')" render=""></each>

                        <div id="checkout-step-shipping_method" class="step-content" data-role="content" role="tabpanel"
                            aria-hidden="false">
                            <form id="co-shipping-method-form" class="form methods-shipping" if="rates().length"
                                submit="setShippingInformation" novalidate="novalidate">

                                <render args="shippingMethodListTemplate"></render>

                                <div id="onepage-checkout-shipping-method-additional-load">
                                    <each args="getRegion('shippingAdditional')" render=""></each>
                                </div>
                                <div role="alert" if="errorValidationMessage().length" class="message notice">
                                    <span text="errorValidationMessage()"></span>
                                </div>
                                <div class="actions-toolbar" id="shipping-method-buttons-container">
                                    <div class="primary" data-role="opc-continue">
                                        <button type="submit"
                                            class="button action continue primary shipping-method-selection-close">
                                            <span>Save & close</span>
                                        </button>
                                    </div>
                                </div>
                            </form>
                            <div class="no-quotes-block message-notice notice message" ifnot="rates().length > 0">
                                <div class="no-quotes-message">
                                    Sorry, no shipping methods are available for this shipping address at this time.
                                </div>
                                <br>
                                <div class="no-quotes-suggestions" data-bind="click:openShippingAddressForm">
                                    <a href="javascript:void(0)">Please try to verify the shipping address again.</a>
                                </div>
                            </div>
                            <div class="no-quotes-contact" ifnot="rates().length > 0">
                                <a href="/contact/" target="_blank">
                                    <span>
                                        You can contact us, we'll be happy assist you better!
                                    </span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
