<div class="step-item">
    <div class="step-item-label">
        <div class="step-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" width="2rem" height="2rem"
                class="Step_StepTitleIcon__cr4hM SvgIcon_SvgIcon__XZVZw">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"
                    d="M16.546 4H3.455C2.65 4 2 4.651 2 5.455v8.727c0 .803.651 1.454 1.455 1.454h13.09c.804 0 1.455-.65 1.455-1.454V5.455C18 4.65 17.349 4 16.546 4ZM2 8.363h16M13.217 13.034h2.756">
                </path>
            </svg>
        </div>
        <div class="step-label">
            <span data-bind="i18n: 'Payment Method'" class="output-content"></span>
        </div>
    </div>
    <div class="step-item-content">

        <div class="step-item-action-label" data-trigger="trigger-payment-method" class="action">
            <div class="mobile-label-after-change" style="display: none;">
                Payment Method
            </div>
            <div data-bind="i18n: 'Select Payment Method'" id="billingMethodSelectStepLabel" class="output-content">
            </div>
            <div class="step-item-action-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" width="2rem" height="2rem"
                    class="SvgIcon_SvgIcon__XZVZw initial-icon">
                    <path fill="currentColor" fill-rule="evenodd"
                        d="M6.793 3.043a1 1 0 0 1 1.414 0l6.25 6.25a1 1 0 0 1 0 1.414l-6.25 6.25a1 1 0 0 1-1.414-1.414L12.336 10 6.793 4.457a1 1 0 0 1 0-1.414Z"
                        clip-rule="evenodd"></path>
                </svg>
                <div class="change-data" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" width="2.4rem"
                        height="2.4rem" class="SvgIcon_SvgIcon__XZVZw">
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M14.376 4.211a1.404 1.404 0 0 1 1.985 0L19.79 7.64m0 0a1.404 1.404 0 0 1 0 1.985l-9.426 9.426a1 1 0 0 1-.534.278l-4.855.857a1 1 0 0 1-1.159-1.159l.857-4.855a1 1 0 0 1 .278-.534l9.426-9.426m.992 1.836-8.781 8.782-.554 3.138 3.138-.554 8.782-8.781-2.585-2.585Z"
                            clip-rule="evenodd"></path>
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M11.665 6.92a1 1 0 0 1 1.414 0l3.999 3.999a1 1 0 0 1-1.414 1.414l-3.999-3.999a1 1 0 0 1 0-1.414Z"
                            clip-rule="evenodd"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div data-bind="mageInit: {
                'Magento_Ui/js/modal/modal':{
                    'type': 'popup',
                    'title': jQuery.mage.__('Select Payment Method'),
                    'responsive': true,
                    'buttons':[],
                    'modalClass':'checkout-modal'
                }}" style="display: none;" id="payment-method-popup">
            <div class="content">
                <div id="payment" role="presentation" class="checkout-payment-method" data-bind="fadeVisible: true">
                    <div id="checkout-step-payment" class="step-content" data-role="content" role="tabpanel"
                        aria-hidden="false">
                        <!-- ko if: (quoteIsVirtual) -->
                        <!-- ko foreach: getRegion('customer-email') -->
                        <!-- ko template: getTemplate() --><!-- /ko -->
                        <!--/ko-->
                        <!--/ko-->
                        <form id="co-payment-form" class="form payments" novalidate="novalidate">
                            <input data-bind='attr: {value: getFormKey()}' type="hidden" name="form_key">
                            <fieldset class="fieldset">
                                <legend class="legend">
                                    <span data-bind="i18n: 'Payment Information'"></span>
                                </legend>
                                <!-- ko foreach: getRegion('place-order-captcha') -->
                                <!-- ko template: getTemplate() --><!-- /ko -->
                                <!-- /ko -->
                                <!-- ko foreach: getRegion('beforeMethods') -->
                                <!-- ko template: getTemplate() --><!-- /ko -->
                                <!-- /ko -->
                                <div id="checkout-payment-method-load" class="opc-payment"
                                    data-bind="visible: isPaymentMethodsAvailable">
                                    <!-- ko foreach: getRegion('payment-methods-list') -->
                                    <!-- ko template: getTemplate() --><!-- /ko -->
                                    <!-- /ko -->
                                </div>
                                <div class="no-quotes-block" data-bind="visible: isPaymentMethodsAvailable() == false">
                                    <!-- ko i18n: 'No Payment method available.'--><!-- /ko -->
                                </div>
                            </fieldset>
                            <div class="actions-toolbar" id="payment-method-buttons-container"
                                data-bind="visible: isPaymentMethodsAvailable() == true">
                                <div class="primary">
                                    <button type="button"
                                        class="button action continue primary payment-method-selection-close"
                                        data-bind="click:()=>{window.dispatchEvent(new CustomEvent('place-order'))}">
                                        <span>Place Order</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="opc-summary-mobile">
</div>
